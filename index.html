<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./apple.png">
<title>Static UI - Layout Editor</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    background: #fff;
    overflow-x: hidden;
}

body {
    padding-top: env(safe-area-inset-top);
    font-family: Arial, sans-serif;
}

img {
    -webkit-user-drag: none;
    user-select: none;
}

.container {
    position: relative;
    width: 390px;
    max-width: 100%;
    margin: 0 auto;
}

.bg-image {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
}

#clock {
    position: absolute;
    top: 352px;
    left: 16px;
    font-family: sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: #000;
    z-index: 100;
    user-select: none;
    background: transparent;
    padding: 1px 4px;
    border-radius: 2px;
    white-space: nowrap;
}

#clock-bg {
    position: absolute;
    top: 352px;
    left: 16px;
    background: #fff;
    border-radius: 2px;
    z-index: 1;
    pointer-events: none;
}

#white-block {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 390px;
    height: 100px;
    background: #fff;
    z-index: 9;
    user-select: none;
}

#yellow-block {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(55px + env(safe-area-inset-top));
    background: linear-gradient(
        to right,
        #f2b15d,
        #f1b262,
        #f1b765,
        #f3bc6a,
        #f4c06d,
        #f4c575,
        #f7c97b,
        #f7d281
    );
    z-index: 999;
    user-select: none;
}

#name-img {
    position: absolute;
    top: 154.41px;
    left: 153.56px;
    width: 198px;
    z-index: 10;
}

#car-img {
    position: absolute;
    top: 391.27px;
    left: 125.95px;
    width: 207px;
    z-index: 10;
    opacity: 0.7;
}

#rest-img {
    position: absolute;
    top: 619.71px;
    left: 6.70px;
    width: 381px;
    z-index: 10;
}

#pulse-logo {
    position: fixed;
    top: calc(242.52px + env(safe-area-inset-top));
    left: 25%;
    transform: translateX(-50%);
    width: 200px;
    filter: brightness(0) invert(80%) sepia(0) saturate(0);
    z-index: 5;
    animation: pulse-animation 1.6s infinite ease-in-out;
}

#header-img {
    position: fixed;
    top: env(safe-area-inset-top);
    left: 50%;
    transform: translateX(-50%);
    width: 390px;
    max-width: 100%;
    z-index: 1000;
    pointer-events: none;
}

#bottom-img {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 390px;
    max-width: 100%;
    z-index: 10;
}

#qr-nav-btn {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 35px;
    width: 80px;
    height: auto;
    z-index: 200;
    transition: opacity 0.2s;
}

#qr-close-btn {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 38px;
    width: 75px;
    height: auto;
    z-index: 2001;
    transition: opacity 0.2s;
}

@keyframes pulse-animation {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

#qr-popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #fff;
    z-index: 2000;
    overflow: hidden;
    justify-content: center;
    align-items: center;
}

#qr-popup-overlay.active {
    display: flex;
}

#qr-popup-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#qr-popup-bg {
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    pointer-events: none;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
}

/* Selected-element drag mode */

#drag-surface {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9000;
    cursor: move;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    background: transparent;
}

body.drag-mode #drag-surface {
    display: block;
}

body.drag-mode #editor-panel,
body.drag-mode #editor-toggle {
    z-index: 10002;
}

#drag-instructions {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    z-index: 10001;
    width: min(340px, calc(100vw - 24px));
    padding: 11px 14px;
    background: rgba(20, 20, 20, 0.94);
    color: #fff;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
    pointer-events: none;
}

body.drag-mode #drag-instructions {
    display: block;
}

.drag-selected {
    outline: 2px dashed #ff7800 !important;
    outline-offset: 2px;
}

/* Editor panel */

#editor-panel {
    position: fixed;
    top: calc(65px + env(safe-area-inset-top));
    right: 10px;
    z-index: 10000;
    width: min(280px, calc(100vw - 20px));
    max-height: calc(100vh - 90px);
    overflow-y: auto;
    padding: 12px;
    background: rgba(25, 25, 25, 0.97);
    color: #fff;
    border-radius: 10px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.3);
    font-size: 13px;
}

#editor-panel h3 {
    margin: 0 0 10px;
    font-size: 15px;
}

#editor-panel button,
#editor-panel select {
    width: 100%;
    margin: 4px 0;
    padding: 9px;
    border: 0;
    border-radius: 5px;
    font-size: 13px;
}

#editor-panel button {
    cursor: pointer;
    background: #f1b765;
    color: #222;
    font-weight: bold;
}

#editor-panel button.secondary {
    background: #e5e5e5;
}

#editor-panel button.active-button {
    background: #ff7800;
    color: #fff;
}

.editor-status {
    margin-top: 7px;
    color: #ddd;
    font-size: 11px;
    line-height: 1.5;
}

#coordinate-output {
    display: none;
    width: 100%;
    height: 180px;
    margin-top: 8px;
    padding: 8px;
    resize: vertical;
    font-family: monospace;
    font-size: 11px;
}

#editor-toggle {
    position: fixed;
    right: 10px;
    top: calc(10px + env(safe-area-inset-top));
    z-index: 10001;
    padding: 9px 12px;
    background: #222;
    color: #fff;
    border: 1px solid #777;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
}

body.editor-hidden #editor-panel {
    display: none;
}

body.layout-locked #drag-surface {
    display: none !important;
}

body.layout-locked #drag-instructions {
    display: none !important;
}
</style>
</head>

<body>

<div id="yellow-block" class="draggable-element" data-drag-name="Yellow header background"></div>

<div class="container" id="main-container">
    <img src="./background.png" class="bg-image" id="bg-img" alt="Background" draggable="false">

    <div id="white-block" class="draggable-element" data-drag-name="White block"></div>

    <div id="clock-bg"></div>

    <div id="clock" class="draggable-element" data-drag-name="Clock">
        <span id="clock-text"></span>
    </div>

    <img src="./name.png" id="name-img" class="draggable-element" data-drag-name="Name image" alt="Name Overlay" draggable="false">

    <img src="./car.png" id="car-img" class="draggable-element" data-drag-name="Car image" alt="Car Overlay" draggable="false">

    <img src="./rest.png" id="rest-img" class="draggable-element" data-drag-name="Rest image" alt="Rest Overlay" draggable="false">
</div>

<img src="./button.png" id="qr-nav-btn" class="draggable-element" data-drag-name="QR navigation button" alt="QR Code Button" draggable="false">

<img src="./bottom.png" id="bottom-img" class="draggable-element" data-drag-name="Bottom image" alt="Bottom" draggable="false">

<img src="./pulse-logo.png" id="pulse-logo" class="draggable-element" data-drag-name="Pulse logo" alt="Pulsing Logo" draggable="false">

<img src="./header.png" id="header-img" alt="Header" draggable="false">

<div id="qr-popup-overlay">
    <div id="qr-popup-container">
        <img src="./qrback.png" id="qr-popup-bg" alt="QR Background" draggable="false">
    </div>

    <img src="./button.png" id="qr-close-btn" class="draggable-element" data-drag-name="QR popup close button" alt="Back Button" draggable="false">
</div>

<!-- This transparent surface lets you move selected elements even when overlapped. -->
<div id="drag-surface" aria-label="Drag selected element"></div>

<div id="drag-instructions">
    Drag anywhere on the screen to move the selected element.
    Press <strong>Escape</strong> to exit drag mode.
</div>

<button id="editor-toggle" type="button">Hide Editor</button>

<div id="editor-panel">
    <h3>Layout Position Editor</h3>

    <label for="element-select">Element to move:</label>

    <select id="element-select">
        <option value="all">All elements (choose one below)</option>
        <option value="yellow-block">Yellow header background</option>
        <option value="white-block">White block</option>
        <option value="clock">Clock</option>
        <option value="name-img">Name image</option>
        <option value="car-img">Car image</option>
        <option value="rest-img">Rest image</option>
        <option value="qr-nav-btn">QR navigation button</option>
        <option value="bottom-img">Bottom image</option>
        <option value="pulse-logo">Pulse logo</option>
        <option value="qr-close-btn">QR popup close button</option>
    </select>

    <button id="move-selected" type="button">Move Selected Element</button>
    <button id="toggle-drag" type="button" class="secondary">Lock Editing</button>
    <button id="show-coordinates" type="button">Show Coordinates</button>
    <button id="copy-coordinates" type="button">Copy Coordinates</button>
    <button id="reset-positions" type="button" class="secondary">Reset Positions</button>
    <button id="hide-editor" type="button" class="secondary">Hide Editor Panel</button>

    <textarea id="coordinate-output" readonly></textarea>

    <div class="editor-status" id="editor-status">
        Select an element, then click "Move Selected Element". Drag anywhere on the page to move it. Positions save automatically.
    </div>
</div>

<script>
"use strict";

document.addEventListener("dragstart", function(event) {
    if (event.target instanceof HTMLImageElement) {
        event.preventDefault();
    }
});

const STORAGE_KEY = "static-ui-layout-positions-v3";

const mainContainer = document.getElementById("main-container");
const clockEl = document.getElementById("clock");
const clockBgEl = document.getElementById("clock-bg");
const qrOverlay = document.getElementById("qr-popup-overlay");
const dragSurface = document.getElementById("drag-surface");
const editorPanel = document.getElementById("editor-panel");
const editorToggle = document.getElementById("editor-toggle");
const editorStatus = document.getElementById("editor-status");
const elementSelect = document.getElementById("element-select");
const coordinateOutput = document.getElementById("coordinate-output");
const moveSelectedButton = document.getElementById("move-selected");
const toggleDragButton = document.getElementById("toggle-drag");

const draggableElements = Array.from(
    document.querySelectorAll(".draggable-element")
);

const originalStyles = {};
let selectedElementId = "clock";
let editingEnabled = true;
let dragMode = false;
let activeDrag = null;
let suppressClickUntil = 0;
let movedDuringInteraction = false;
let pulseWasAnimating = true;

draggableElements.forEach(function(element) {
    originalStyles[element.id] = element.getAttribute("style");
});

/* ---------- Position saving ---------- */

function savePositions() {
    const saved = {};

    draggableElements.forEach(function(element) {
        saved[element.id] = element.getAttribute("style") || "";
    });

    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        setStatus("Positions saved automatically.");
    } catch (error) {
        setStatus("Could not save positions in this browser.");
    }
}

function loadPositions() {
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

        draggableElements.forEach(function(element) {
            if (Object.prototype.hasOwnProperty.call(saved, element.id)) {
                element.setAttribute("style", saved[element.id]);
            }
        });
    } catch (error) {
        console.error("Could not load saved positions:", error);
    }
}

/* ---------- Coordinate helpers ---------- */

function isContainerChild(element) {
    return element.parentElement === mainContainer;
}

function getPosition(element) {
    const rect = element.getBoundingClientRect();

    if (isContainerChild(element)) {
        const parentRect = mainContainer.getBoundingClientRect();

        return {
            x: rect.left - parentRect.left,
            y: rect.top - parentRect.top
        };
    }

    return {
        x: rect.left,
        y: rect.top
    };
}

function prepareElement(element) {
    const rect = element.getBoundingClientRect();

    if (isContainerChild(element)) {
        const parentRect = mainContainer.getBoundingClientRect();

        element.style.position = "absolute";
        element.style.left = (rect.left - parentRect.left) + "px";
        element.style.top = (rect.top - parentRect.top) + "px";
    } else {
        element.style.position = "fixed";
        element.style.left = rect.left + "px";
        element.style.top = rect.top + "px";
    }

    element.style.right = "auto";
    element.style.bottom = "auto";
    element.style.transform = "none";

    if (element.id === "pulse-logo") {
        pulseWasAnimating = getComputedStyle(element).animationName !== "none";
        element.style.animation = "none";
    }
}

function restorePulseAnimation(element) {
    if (element.id === "pulse-logo" && pulseWasAnimating) {
        element.style.animation = "";
    }
}

function setStatus(message) {
    editorStatus.textContent = message;
}

/* ---------- Element selection ---------- */

function getSelectedElement() {
    return document.getElementById(selectedElementId);
}

function updateSelectionOutline() {
    draggableElements.forEach(function(element) {
        element.classList.toggle(
            "drag-selected",
            element.id === selectedElementId && dragMode
        );
    });
}

elementSelect.addEventListener("change", function() {
    selectedElementId = this.value;

    if (selectedElementId === "all") {
        selectedElementId = "clock";
        this.value = "clock";
        setStatus("Choose one specific element at a time.");
    } else {
        setStatus("Selected: " + getSelectedElement().dataset.dragName + ".");
    }

    updateSelectionOutline();

    if (dragMode) {
        setStatus(
            "Selected: " + getSelectedElement().dataset.dragName +
            ". Drag anywhere on the screen to move it."
        );
    }
});

/* ---------- Dragging system ---------- */

function enterDragMode() {
    if (!editingEnabled) {
        setStatus("Unlock editing first.");
        return;
    }

    const element = getSelectedElement();

    if (!element) {
        setStatus("Select an element first.");
        return;
    }

    if (
        element.id === "qr-close-btn" &&
        !qrOverlay.classList.contains("active")
    ) {
        qrOverlay.classList.add("active");
        document.body.style.overflow = "hidden";
    }

    dragMode = true;
    document.body.classList.add("drag-mode");
    moveSelectedButton.textContent = "Finish Moving Element";
    moveSelectedButton.classList.add("active-button");

    updateSelectionOutline();

    setStatus(
        "Moving: " + element.dataset.dragName +
        ". Drag anywhere outside the editor panel. Press Escape or click Finish Moving Element when done."
    );
}

function exitDragMode() {
    dragMode = false;
    activeDrag = null;

    document.body.classList.remove("drag-mode");

    moveSelectedButton.textContent = "Move Selected Element";
    moveSelectedButton.classList.remove("active-button");

    document.removeEventListener("pointermove", moveDrag);
    document.removeEventListener("pointerup", endDrag);
    document.removeEventListener("pointercancel", endDrag);

    updateSelectionOutline();
    syncClockBg();

    setStatus("Editing ready. Select another element or copy the coordinates.");
}

function startDrag(event) {
    if (!dragMode || !editingEnabled) return;
    if (event.button !== undefined && event.button !== 0) return;
    if (event.target.closest("#editor-panel")) return;
    if (event.target.closest("#editor-toggle")) return;

    const element = getSelectedElement();
    if (!element) return;

    event.preventDefault();

    prepareElement(element);

    const rect = element.getBoundingClientRect();

    activeDrag = {
        element: element,
        pointerId: event.pointerId,
        startPointerX: event.clientX,
        startPointerY: event.clientY,
        startLeft: parseFloat(element.style.left) || 0,
        startTop: parseFloat(element.style.top) || 0
    };

    movedDuringInteraction = false;

    try {
        dragSurface.setPointerCapture(event.pointerId);
    } catch (error) {
        /* Document listeners provide a fallback. */
    }

    document.addEventListener("pointermove", moveDrag, { passive: false });
    document.addEventListener("pointerup", endDrag);
    document.addEventListener("pointercancel", endDrag);

    setStatus("Dragging " + element.dataset.dragName + "...");
}

function moveDrag(event) {
    if (!activeDrag || event.pointerId !== activeDrag.pointerId) return;

    event.preventDefault();

    const drag = activeDrag;
    const element = drag.element;

    const dx = event.clientX - drag.startPointerX;
    const dy = event.clientY - drag.startPointerY;

    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        movedDuringInteraction = true;
    }

    let left = drag.startLeft + dx;
    let top = drag.startTop + dy;

    if (isContainerChild(element)) {
        const parentRect = mainContainer.getBoundingClientRect();

        /* Account for horizontal page centring and container position. */
        element.style.left = left + "px";
        element.style.top = top + "px";

        /* Keep coordinates relative to the container, not the viewport. */
        if (parentRect.width > 0 && mainContainer.offsetWidth > 0) {
            const scaleX = parentRect.width / mainContainer.offsetWidth;
            const scaleY = parentRect.height / mainContainer.offsetHeight;

            if (scaleX && scaleY) {
                element.style.left = (left / scaleX) + "px";
                element.style.top = (top / scaleY) + "px";
            }
        }
    } else {
        element.style.left = left + "px";
        element.style.top = top + "px";
    }

    element.style.right = "auto";
    element.style.bottom = "auto";

    if (element.id === "clock") {
        syncClockBg();
    }
}

function endDrag(event) {
    if (!activeDrag) return;

    if (
        event &&
        event.pointerId !== undefined &&
        event.pointerId !== activeDrag.pointerId
    ) {
        return;
    }

    const element = activeDrag.element;

    document.removeEventListener("pointermove", moveDrag);
    document.removeEventListener("pointerup", endDrag);
    document.removeEventListener("pointercancel", endDrag);

    activeDrag = null;

    suppressClickUntil = Date.now() + 250;

    restorePulseAnimation(element);

    if (movedDuringInteraction) {
        savePositions();
        setStatus("Position saved. Keep moving this element or finish and select another.");
    } else {
        setStatus("No movement detected. Drag farther to reposition the element.");
    }

    syncClockBg();
}

dragSurface.addEventListener("pointerdown", startDrag);

/* ---------- Lock / unlock editing ---------- */

moveSelectedButton.addEventListener("click", function() {
    if (dragMode) {
        exitDragMode();
    } else {
        enterDragMode();
    }
});

toggleDragButton.addEventListener("click", function() {
    editingEnabled = !editingEnabled;

    document.body.classList.toggle("layout-locked", !editingEnabled);

    if (!editingEnabled && dragMode) {
        exitDragMode();
    }

    toggleDragButton.textContent = editingEnabled
        ? "Lock Editing"
        : "Unlock Editing";

    setStatus(
        editingEnabled
            ? "Editing unlocked. Select an element to move."
            : "Editing locked. Your saved positions are preserved."
    );
});

/* ---------- QR popup ---------- */

document.getElementById("qr-nav-btn").addEventListener("click", function(event) {
    if (Date.now() < suppressClickUntil) {
        event.preventDefault();
        return;
    }

    if (editingEnabled) {
        setStatus("To use the QR button, click Lock Editing first.");
        return;
    }

    qrOverlay.classList.add("active");
    document.body.style.overflow = "hidden";
});

document.getElementById("qr-close-btn").addEventListener("click", function(event) {
    if (Date.now() < suppressClickUntil) {
        event.preventDefault();
        return;
    }

    if (!editingEnabled) {
        qrOverlay.classList.remove("active");
        document.body.style.overflow = "";
    }
});

/* ---------- Clock ---------- */

function syncClockBg() {
    if (!clockEl || !clockBgEl || !mainContainer) return;

    const clockRect = clockEl.getBoundingClientRect();
    const containerRect = mainContainer.getBoundingClientRect();

    clockBgEl.style.left = (clockRect.left - containerRect.left) + "px";
    clockBgEl.style.top = (clockRect.top - containerRect.top) + "px";
    clockBgEl.style.width = clockRect.width + "px";
    clockBgEl.style.height = clockRect.height + "px";
}

function updateClock() {
    const now = new Date();

    let hours = now.getHours();
    const ampm = hours >= 12 ? "pm" : "am";

    hours = hours % 12 || 12;

    const minutes = String(now.getMinutes()).padStart(2, "0");

    document.getElementById("clock-text").textContent =
        `${now.getDate()} ` +
        `${now.toLocaleString("default", { month: "short" })} ` +
        `${now.getFullYear()} ${hours}:${minutes}${ampm}`;

    syncClockBg();
}

setInterval(updateClock, 1000);
updateClock();

/* ---------- Coordinates ---------- */

function getCoordinates(element) {
    const rect = element.getBoundingClientRect();
    const position = getPosition(element);

    return {
        id: element.id,
        name: element.dataset.dragName || element.id,
        x: Math.round(position.x * 100) / 100,
        y: Math.round(position.y * 100) / 100,
        viewportX: Math.round(rect.left * 100) / 100,
        viewportY: Math.round(rect.top * 100) / 100,
        width: Math.round(rect.width * 100) / 100,
        height: Math.round(rect.height * 100) / 100,
        coordinateSystem: isContainerChild(element)
            ? "main-container"
            : "viewport"
    };
}

function getElementsForOutput() {
    if (elementSelect.value === "all") {
        return draggableElements;
    }

    return [getSelectedElement()].filter(Boolean);
}

document.getElementById("show-coordinates").addEventListener("click", function() {
    coordinateOutput.value = JSON.stringify(
        getElementsForOutput().map(getCoordinates),
        null,
        2
    );

    coordinateOutput.style.display = "block";

    setStatus("Coordinates displayed. Copy them and send them to me when you're finished.");
});

document.getElementById("copy-coordinates").addEventListener("click", async function() {
    if (!coordinateOutput.value.trim()) {
        document.getElementById("show-coordinates").click();
    }

    try {
        await navigator.clipboard.writeText(coordinateOutput.value);
        setStatus("Coordinates copied. Paste them into your message.");
    } catch (error) {
        coordinateOutput.focus();
        coordinateOutput.select();
        setStatus("Coordinates selected. Press Command+C to copy them.");
    }
});

/* ---------- Reset positions ---------- */

document.getElementById("reset-positions").addEventListener("click", function() {
    if (!confirm("Reset every element to its original position?")) return;

    exitDragMode();

    draggableElements.forEach(function(element) {
        const original = originalStyles[element.id];

        if (original === null) {
            element.removeAttribute("style");
        } else {
            element.setAttribute("style", original);
        }
    });

    localStorage.removeItem(STORAGE_KEY);

    coordinateOutput.value = "";
    coordinateOutput.style.display = "none";

    syncClockBg();

    setStatus("All positions reset to their original CSS settings.");
});

/* ---------- Editor visibility ---------- */

function hideEditor() {
    document.body.classList.add("editor-hidden");
    editorToggle.textContent = "Show Editor";
}

function showEditor() {
    document.body.classList.remove("editor-hidden");
    editorToggle.textContent = "Hide Editor";
}

document.getElementById("hide-editor").addEventListener("click", hideEditor);

editorToggle.addEventListener("click", function() {
    if (document.body.classList.contains("editor-hidden")) {
        showEditor();
    } else {
        hideEditor();
    }
});

/* Escape exits drag mode. */
document.addEventListener("keydown", function(event) {
    if (event.key === "Escape" && dragMode) {
        exitDragMode();
    }
});

window.addEventListener("resize", syncClockBg);

/* ---------- Initial setup ---------- */

loadPositions();

elementSelect.value = selectedElementId;
syncClockBg();
</script>

</body>
</html>
