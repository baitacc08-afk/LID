<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd600">
  <title>Digital Pass</title>

  <style>
    :root {
      --main-width: 390px;
      --header-height: 106px;
      --yellow-height: 55px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
    }

    img {
      display: block;
      max-width: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    /* Yellow strip across the top of the screen */
    #yellow-block {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--yellow-height);
      background: #ffd600;
      z-index: 1;
      pointer-events: none;
    }

    /* Main 390px-wide content area */
    #main-container {
      position: relative;
      width: var(--main-width);
      max-width: 100%;
      min-height: 1400px;
      margin: 0 auto;
      overflow: visible;
      background: #fff;
      z-index: 2;
    }

    /* Background image */
    #bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 1400px;
      object-fit: fill;
      z-index: 0;
      pointer-events: none;
    }

    /* White block near the bottom of the main layout */
    #white-block {
      position: absolute;
      top: 1300px;
      left: 0;
      width: 390px;
      height: 100px;
      background: #fff;
      z-index: 1;
      pointer-events: none;
    }

    /* Header artwork */
    #header-img {
      position: fixed;
      top: calc(-1.72px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: min(390px, 100vw);
      height: 106px;
      object-fit: fill;
      z-index: 20;
      pointer-events: none;
    }

    /* Clock */
    #clock {
      position: absolute;
      top: 352px;
      left: 23.05px;
      width: 155.61px;
      height: 19.5px;
      z-index: 10;
      color: #000;
      font-size: 16px;
      line-height: 19.5px;
      white-space: nowrap;
      overflow: hidden;
      pointer-events: none;
    }

    /* Name artwork */
    #name-img {
      position: absolute;
      top: 151.84px;
      left: 150.2px;
      width: 232.94px;
      height: 177.08px;
      object-fit: fill;
      z-index: 5;
      pointer-events: none;
    }

    /* Car artwork */
    #car-img {
      position: absolute;
      top: 392.65px;
      left: 127.41px;
      width: 205.48px;
      height: 223.45px;
      object-fit: fill;
      z-index: 6;
      pointer-events: none;
    }

    /* Main lower artwork */
    #rest-img {
      position: absolute;
      top: 613.18px;
      left: 0.44px;
      width: 389.05px;
      height: 538px;
      object-fit: fill;
      z-index: 4;
      pointer-events: none;
    }

    /* Pulse logo: centred responsively */
    #pulse-logo {
      position: fixed;
      top: calc(238.28px + env(safe-area-inset-top, 0px));
      left: 50%;
      width: min(223.03px, 70vw);
      height: auto;
      aspect-ratio: 223.03 / 194.06;
      object-fit: contain;
      transform: translateX(-50%);
      transform-origin: center;
      z-index: 30;
      pointer-events: none;
      animation: pulse 2s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: translateX(-50%) scale(1);
      }

      50% {
        transform: translateX(-50%) scale(1.035);
      }
    }

    /* Bottom artwork */
    #bottom-img {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(390px, 100vw);
      height: auto;
      aspect-ratio: 390 / 117.65;
      object-fit: fill;
      z-index: 40;
      pointer-events: none;
    }

    /* QR navigation button */
    #qr-nav-btn {
      position: fixed;
      top: calc(555.34px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(77px);
      width: 80px;
      height: 63.65px;
      object-fit: fill;
      z-index: 50;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* QR popup overlay */
    #qr-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding:
        max(20px, env(safe-area-inset-top, 0px))
        20px
        max(20px, env(safe-area-inset-bottom, 0px));
      background: rgba(0, 0, 0, 0.78);
      z-index: 1000;
    }

    #qr-overlay.open {
      display: flex;
    }

    #qr-popup-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(390px, 100%);
      max-height: 100%;
    }

    #qrback-img {
      display: block;
      width: 100%;
      max-height: calc(100dvh - 40px);
      height: auto;
      object-fit: contain;
    }

    /* Close control is deliberately visible and usable */
    #qr-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 42px;
      height: 42px;
      object-fit: contain;
      cursor: pointer;
      z-index: 1002;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      -webkit-tap-highlight-color: transparent;
    }

    /* Prevent the popup from being too large on short screens */
    @media (max-height: 650px) {
      #pulse-logo {
        top: calc(190px + env(safe-area-inset-top, 0px));
        width: min(190px, 60vw);
      }

      #qr-nav-btn {
        top: calc(490px + env(safe-area-inset-top, 0px));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #pulse-logo {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="yellow-block" aria-hidden="true"></div>

  <main id="main-container">
    <img
      id="bg-img"
      src="background.png"
      alt=""
      draggable="false"
    >

    <div id="white-block" aria-hidden="true"></div>

    <div id="clock" aria-label="Current time"></div>

    <img
      id="name-img"
      src="name.png"
      alt=""
      draggable="false"
    >

    <img
      id="car-img"
      src="car.png"
      alt=""
      draggable="false"
    >

    <img
      id="rest-img"
      src="rest.png"
      alt=""
      draggable="false"
    >
  </main>

  <img
    id="header-img"
    src="header.png"
    alt=""
    draggable="false"
  >

  <img
    id="pulse-logo"
    src="pulse-logo.png"
    alt=""
    draggable="false"
  >

  <img
    id="bottom-img"
    src="bottom.png"
    alt=""
    draggable="false"
  >

  <img
    id="qr-nav-btn"
    src="button.png"
    alt="Open QR code"
    role="button"
    tabindex="0"
    draggable="false"
  >

  <div
    id="qr-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="QR code"
  >
    <div id="qr-popup-container">
      <img
        id="qrback-img"
        src="qrback.png"
        alt="QR code"
        draggable="false"
      >

      <button
        id="qr-close-btn"
        type="button"
        aria-label="Close QR popup"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  </div>

  <script>
    "use strict";

    const clock = document.getElementById("clock");
    const qrNavButton = document.getElementById("qr-nav-btn");
    const qrOverlay = document.getElementById("qr-overlay");
    const qrPopupContainer = document.getElementById("qr-popup-container");
    const qrCloseButton = document.getElementById("qr-close-btn");

    function updateClock() {
      if (!clock) return;

      const now = new Date();

      clock.textContent = now.toLocaleTimeString("en-AU", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function openQRPopup() {
      if (!qrOverlay) return;

      qrOverlay.classList.add("open");
      qrOverlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      if (qrCloseButton) {
        qrCloseButton.focus();
      }
    }

    function closeQRPopup() {
      if (!qrOverlay) return;

      qrOverlay.classList.remove("open");
      qrOverlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";

      if (qrNavButton) {
        qrNavButton.focus();
      }
    }

    if (qrNavButton) {
      qrNavButton.addEventListener("click", openQRPopup);

      qrNavButton.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openQRPopup();
        }
      });
    }

    if (qrCloseButton) {
      qrCloseButton.addEventListener("click", closeQRPopup);
    }

    if (qrOverlay) {
      qrOverlay.addEventListener("click", (event) => {
        if (event.target === qrOverlay) {
          closeQRPopup();
        }
      });
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && qrOverlay?.classList.contains("open")) {
        closeQRPopup();
      }
    });

    updateClock();
    window.setInterval(updateClock, 1000);

    /*
      Image handling:
      Keep the original image files and use browser-native rendering.
      Do not upscale automatically, because interpolation does not
      recover real image detail and can make images look softer.
    */

    document.querySelectorAll("img").forEach((img) => {
      img.addEventListener("error", () => {
        console.warn("Image failed to load:", img.getAttribute("src"));
      });
    });
  </script>
</body>
</html>
